name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install flask python-dotenv numpy scikit-learn
      - name: Syntax check
        run: python -m compileall -q client server
      - name: Server imports
        run: cd server && SECRET_KEY=ci python -c "import server"
