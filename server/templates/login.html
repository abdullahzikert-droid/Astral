<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Apexion / Vigil Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #090e1a;
    --bg-secondary: rgba(22, 28, 45, 0.65);
    --bg-card: rgba(30, 41, 59, 0.45);
    --bg-code: #030712;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-color: rgba(255, 255, 255, 0.08);
    --primary-color: #6366f1;
    --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
    --success-color: #10b981;
    --danger-color: #ef4444;
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.4);
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  }
  body {
    font-family: var(--font-sans);
    font-size: 14px;
    margin: 0;
    padding: 0;
    color: var(--text-primary);
    background: var(--bg-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: var(--bg-secondary);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 360px;
    box-shadow: var(--shadow-lg);
    box-sizing: border-box;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .login-card h2 {
    font-size: 20px;
    font-weight: 700;
    margin-top: 0;
    margin-bottom: 8px;
    text-align: center;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .login-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
    margin-bottom: 24px;
  }
  .flash {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    color: #fca5a5;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  label {
    display: block;
    margin-top: 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  input[type=text], input[type=password] {
    width: 100%;
    box-sizing: border-box;
    background: var(--bg-code);
    color: #fff;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
    margin-top: 6px;
    outline: none;
    transition: all 0.2s;
  }
  input[type=text]:focus, input[type=password]:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
  }
  input[type=submit] {
    width: 100%;
    background: var(--primary-gradient);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 24px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
  }
  input[type=submit]:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(99, 102, 241, 0.3);
  }
  input[type=submit]:active {
    transform: translateY(0);
  }
  .note {
    font-size: 12px;
    color: var(--success-color);
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.2);
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="login-card">
  <h2>Apexion & Vigil</h2>
  <div class="login-subtitle">Security Dashboard Login</div>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}
        <div class="flash">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% if first_run %}
  <div class="note">Setup Mode: Create the first administrator account.</div>
  {% endif %}

  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <input type="submit" value="{{ 'Create admin & login' if first_run else 'Sign In' }}">
  </form>
</div>
</body>
</html>
